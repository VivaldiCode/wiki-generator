[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-generator"
version = "0.1.0"
description = "Gera uma wiki completa e padronizada de um repositorio usando Claude Code em modo headless (subscricao)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guilherme Pinto" }]
keywords = ["documentation", "wiki", "claude", "claude-code", "codebase"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wiki-generator = "wiki_generator.cli:main"
wikigen = "wiki_generator.cli:main"

[tool.setuptools.packages.find]
include = ["wiki_generator*"]
